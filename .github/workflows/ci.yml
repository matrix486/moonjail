name: CI

on:
  push:
  pull_request:

jobs:
  native:
    name: Native check and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check types and warnings
        run: moon check --target native --warn-list +unnecessary_annotation
      - name: Run tests
        run: moon test --target native
      - name: Build CLI
        run: moon build --target native
      - name: Smoke-test CLI and demo
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon run cmd/moonjail -- check examples/deny-socket.json
          moon run cmd/moonjail -- demo
          set +e
          moon run cmd/moonjail -- check missing-profile.json 2> cli-error.txt
          status=$?
          set -e
          test "$status" -eq 3
          grep -q 'moonjail:' cli-error.txt
          set +e
          moon run cmd/moonjail -- run examples/deny-socket.json /usr/bin/false
          status=$?
          set -e
          test "$status" -eq 10
          bash examples/agent-tool-smoke.sh

  portable:
    name: Portable policy compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: moon check --target all --warn-list +unnecessary_annotation

  package:
    name: Release archive contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - name: Keep private application out of the package
        shell: bash
        run: |
          touch submission-application-private.md
          git check-ignore -q submission-application-private.md
          files="$(moon package --list 2>&1)"
          grep -Fxq 'LICENSE' <<< "$files"
          grep -Fxq 'README.mbt.md' <<< "$files"
          if grep -Fq 'submission-application-private.md' <<< "$files"; then
            echo 'Private application is present in the release archive' >&2
            exit 1
          fi
